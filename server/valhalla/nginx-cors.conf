server {
    listen 443 ssl http2;
    server_name routing.unlockvenice.com;

    # TLS directives/certificates are intentionally deployment-specific.

    location = /status {
        add_header Access-Control-Allow-Origin "https://www.unlockvenice.com" always;
        add_header Vary "Origin" always;
        proxy_pass http://127.0.0.1:8002/status;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
    }

    location = /route {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://www.unlockvenice.com" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        limit_except POST { deny all; }
        client_max_body_size 32k;

        add_header Access-Control-Allow-Origin "https://www.unlockvenice.com" always;
        add_header Vary "Origin" always;

        proxy_pass http://127.0.0.1:8002/route;
        proxy_set_header Content-Type application/json;
        proxy_connect_timeout 3s;
        proxy_read_timeout 9s;
    }
}
