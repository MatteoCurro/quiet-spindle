services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./custom_files:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/europe/italy/nord-est-latest.osm.pbf
      build_admins: "True"
      build_time_zones: "True"
      build_transit: "False"
      build_tar: "True"
      server_threads: "2"
      update_existing_config: "True"
